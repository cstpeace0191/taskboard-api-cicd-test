name: 버그 리포트
description: 의도와 다르게 동작하는 문제를 알려주세요
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        재현 절차와 완료 조건이 구체적일수록 사람과 Claude 모두 빨리 고칠 수 있습니다.
  - type: input
    id: endpoint
    attributes:
      label: 엔드포인트
      placeholder: "예: DELETE /tasks/{task_id}"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 그대로 복사해 실행할 수 있는 curl 명령
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 상태 코드, 응답 본문, 서버 로그
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 체크리스트로 작성하면 테스트로 옮기기 쉽습니다
      value: |
        - [ ]
        - [ ] 위 동작을 확인하는 테스트 추가
    validations:
      required: true
