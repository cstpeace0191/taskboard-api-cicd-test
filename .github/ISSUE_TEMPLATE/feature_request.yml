name: 기능 요청
description: 새 엔드포인트나 동작 개선을 제안해 주세요
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 왜 필요한가요? 누가 쓰나요?
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: 요구사항
      description: 요청·응답 예시, 기본값, 오류 코드(404/409/422)를 적어 주세요
    validations:
      required: true
  - type: dropdown
    id: breaking
    attributes:
      label: 기존 응답 형식이 바뀌나요?
      options:
        - 아니요
        - 예 (Breaking change)
        - 모르겠음
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      value: |
        - [ ]
        - [ ] 정상·오류 경로 테스트
    validations:
      required: true
