# 의존성 자동 업데이트 PR (주 1회). 생성된 PR도 CI·보안 검사를 통과해야 병합된다.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-deps:
        patterns: ["*"]
    labels: ["dependencies"]
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
