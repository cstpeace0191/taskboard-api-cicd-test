# CI 실패 자동 수정: PR의 CI가 실패하면 Claude가 로그를 읽고 같은 브랜치에 수정 커밋을 push한다.
#
# 안전장치
#  - opt-in: PR에 'ci-autofix' 라벨이 있을 때만 실행 (비용·예상치 못한 커밋 방지)
#  - 같은 저장소의 PR만 (포크 PR 제외), 봇이 시작한 실행 제외 (Dependabot 등)
#  - 1회 제한: 직전 커밋 메시지에 [autofix]가 있으면 다시 실행하지 않음 → 무한 루프 방지
#  - workflow_run 은 기본 브랜치의 이 파일로 실행된다 (PR이 이 파일을 바꿔도 적용 안 됨)
# 주의: PR 브랜치의 코드를 쓰기 권한으로 실행하므로 쓰기 권한자를 모두 신뢰하는 저장소에서만 사용.
name: Claude CI Autofix
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  autofix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.type != 'Bot' &&
      !contains(github.event.workflow_run.head_commit.message, '[autofix]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-autofix-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Find PR and check opt-in label
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --state open \
                 --json number --jq '.[0].number // empty')
          if [[ -z "$PR" ]]; then echo "no open PR for $HEAD_BRANCH"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          LABELS=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if grep -qx "ci-autofix" <<<"$LABELS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "number=$PR" >> "$GITHUB_OUTPUT"
          else
            echo "PR #$PR has no ci-autofix label → skip"; echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.pr.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - if: steps.pr.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.pr.outputs.run == 'true'
        run: pip install -r requirements.txt

      - if: steps.pr.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # 프롬프트에는 번호·이름만 넘긴다. 로그는 Claude가 gh로 직접 읽는다.
          prompt: >-
            /fix-ci RUN_ID: ${{ github.event.workflow_run.id }}
            PR: ${{ steps.pr.outputs.number }}
            BRANCH: ${{ github.event.workflow_run.head_branch }}
          claude_args: |
            --max-turns 25
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(gh run view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git:*),Bash(pytest:*),Bash(ruff:*)"
