# 보안 검사: 의존성 취약점(pip-audit) · PR 의존성 변경 검토 · CodeQL 정적 분석
# Dependency review와 CodeQL은 공개 저장소에서 무료 (비공개는 GitHub Advanced Security 필요).
name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * 1"   # 매주 월요일 09:30 KST: 새로 공개된 취약점 확인
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Audit requirements
        run: pip-audit -r requirements.txt --strict --desc

  dependency-review:
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  codeql:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
