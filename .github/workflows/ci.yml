# CI: 빠른 검사(lint) → 테스트 매트릭스 → 이미지 빌드 확인 → 단일 게이트(ci-ok)
# 브랜치 보호(ruleset)에는 매트릭스 이름 대신 'ci-ok' 하나만 필수 검사로 등록한다.
# (paths 필터를 쓰지 않는다: 필수 검사가 실행되지 않으면 PR이 영원히 대기 상태가 됨)
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.17.*   # requirements.txt 와 같은 버전
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest
        run: >-
          pytest --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80 --junitxml=junit.xml
      - name: Job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          v = os.environ["PYV"]
          try:
              s = ET.parse("junit.xml").getroot()
              s = s if s.tag == "testsuite" else s[0]
              t, f, e = (int(s.get(k, 0)) for k in ("tests", "failures", "errors"))
              cov = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
              print(f"### Python {v}: {t - f - e}/{t} passed, coverage {cov:.1f}%")
          except Exception as exc:  # 테스트가 시작도 못한 경우
              print(f"### Python {v}: no report ({exc.__class__.__name__})")
          PY
        env:
          PYV: ${{ matrix.python-version }}
      - name: Upload reports
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml
          retention-days: 7

  image:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (push 없음)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: taskboard-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: |
          docker run -d --name api -p 8000:8000 taskboard-api:ci
          bash scripts/smoke_test.sh http://127.0.0.1:8000
      - name: Container logs
        if: failure()
        run: docker logs api

  # 브랜치 보호에 등록할 단일 필수 검사
  ci-ok:
    if: always()
    needs: [lint, test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All CI jobs succeeded?
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [[ "$r" == "success" ]] || { echo "::error::CI job result: $r"; exit 1; }
          done
